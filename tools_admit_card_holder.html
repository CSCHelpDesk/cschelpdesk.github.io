<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admit card holder sheet | CSC Desk</title><meta name="description" content="Keep your exam details, centre address and things-to-carry list on one printed sheet, with your admit card.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.fld textarea,.field textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%}.doc{width:210mm;min-height:297mm;padding:18mm 18mm;font-size:12pt;line-height:1.5}.doc .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b6e4f;padding-bottom:8px;margin-bottom:10px}
.doc h2{font-size:20pt;color:#0b6e4f;margin:0}.doc h3{font-size:13pt;margin:2px 0}.doc h4{margin:14px 0 4px;color:#0b6e4f}.doc .hd img,.doc .pbx{width:28mm;height:35mm;object-fit:cover;border:1px solid #888}.doc .pbx{display:flex;align-items:center;justify-content:center;color:#888;border-style:dashed}
.doc table{width:100%;border-collapse:collapse}.doc td{padding:6px 8px;border-bottom:1px solid #ccc;vertical-align:top}.doc td:first-child{width:32%;color:#444}.doc ul{list-style:none;margin:0;padding:0;columns:2}.doc .adm{width:100%;max-height:120mm;object-fit:contain;border:1px solid #ccc}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Documents</div><h1>Admit card holder sheet</h1><p>Keep your exam details, centre address and things-to-carry list on one printed sheet, with your admit card.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="nm">Candidate name</label><input type="text" id="nm" value="Candidate Name" ></div><div class="row2"><div class="field"><label for="rl">Roll number</label><input type="text" id="rl" value="1234567890" ></div><div class="field"><label for="sh">Shift / batch</label><input type="text" id="sh" value="Shift 1" ></div></div><div class="field"><label for="ex">Exam name</label><input type="text" id="ex" value="Exam name" ></div><div class="row2"><div class="field"><label for="dt">Exam date</label><input type="date" id="dt" value="" ></div><div class="field"><label for="tm">Reporting time</label><input type="text" id="tm" value="08:00 AM" ></div></div><div class="field"><label for="ce">Exam centre name</label><input type="text" id="ce" value="Centre name" ></div><div class="field"><label for="ca">Centre address</label><input type="text" id="ca" value="Full address of the exam centre" ></div><div class="field"><label for="ct">Emergency contact</label><input type="text" id="ct" value="98765 00000" ></div><div class="field"><label>Things to carry</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Printed admit card" checked> Printed admit card</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Photo ID (Aadhaar, PAN, Voter ID or DL)" checked> Photo ID (Aadhaar, PAN, Voter ID or DL)</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Passport size photos" checked> Passport size photos</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Black or blue ball pen" checked> Black or blue ball pen</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Transparent water bottle" > Transparent water bottle</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Copy of admit card and ID" > Copy of admit card and ID</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Wrist watch (if allowed)" > Wrist watch (if allowed)</label><label style="font-weight:400;display:block"><input type="checkbox" class="ck" value="Cash for travel" > Cash for travel</label></div><div class="row2"><div class="field"><label for="pf">Candidate photo</label><input type="file" id="pf" accept="image/*"></div><div class="field"><label for="af">Admit card scan (optional)</label><input type="file" id="af" accept="image/*"></div></div><button class="btn" id="pr" type="button"><i class="fa-solid fa-print"></i> Print</button><p class="note">Print one sheet and keep it with the admit card. If you add the admit card scan, it prints below the details.</p></section><section style="overflow-x:auto"><div class="paper doc" id="sheet"></div></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const dmy=v=>v?v.split('-').reverse().join('/'):'';
const readImg=(file,cb)=>{if(!file)return;const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);};
let ph='',ad='';
function draw(){const g=x=>esc($(x).value);const ck=[].slice.call(document.querySelectorAll('.ck:checked')).map(x=>'<li>&#9744; '+esc(x.value)+'</li>').join('');
 $('sheet').innerHTML='<div class="hd"><div><h2>EXAM DAY SHEET</h2><h3>'+g('ex')+'</h3></div>'+(ph?'<img src="'+ph+'" alt="">':'<div class="pbx">Photo</div>')+'</div><table><tr><td>Candidate</td><td><b>'+g('nm')+'</b></td></tr><tr><td>Roll number</td><td><b>'+g('rl')+'</b></td></tr><tr><td>Exam date</td><td><b>'+esc(dmy($('dt').value))+'</b> &nbsp; '+g('sh')+'</td></tr><tr><td>Reporting time</td><td><b>'+g('tm')+'</b></td></tr><tr><td>Centre</td><td>'+g('ce')+'<br>'+g('ca')+'</td></tr><tr><td>Emergency contact</td><td>'+g('ct')+'</td></tr></table><h4>Things to carry</h4><ul>'+ck+'</ul>'+(ad?'<h4>Admit card</h4><img class="adm" src="'+ad+'" alt="">':'');}
$('pf').onchange=e=>readImg(e.target.files[0],u=>{ph=u;draw();});$('af').onchange=e=>readImg(e.target.files[0],u=>{ad=u;draw();});
document.querySelectorAll('.panel input,.panel select').forEach(e=>{if(e.type!=='file'){e.oninput=draw;e.onchange=draw;}});$('pr').onclick=()=>window.print();draw();</script></body></html>
