<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank application letters | CSC Desk</title><meta name="description" content="Ready letters for common bank work: mobile number, address, statement, new card, cheque book, close account.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.fld textarea,.field textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%}.doc{width:210mm;min-height:297mm;padding:25mm 22mm;font-size:12.5pt;line-height:1.75;text-align:justify}.doc p{margin-bottom:12px}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Documents</div><h1>Bank application letters</h1><p>Ready letters for common bank work: mobile number, address, statement, new card, cheque book, close account.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="ty">Application type</label><select id="ty"></select></div>
<div class="field"><label for="bank">Bank name</label><input type="text" id="bank" value="State Bank of India" ></div><div class="field"><label for="br">Branch</label><input type="text" id="br" value="Main Branch, Rohtak" ></div><div class="row2"><div class="field"><label for="nm">Account holder name</label><input type="text" id="nm" value="Ramesh Kumar" ></div><div class="field"><label for="ac">Account number</label><input type="text" id="ac" value="1234567890" ></div></div><div class="row2"><div class="field"><label for="mb">Mobile number</label><input type="text" id="mb" value="9876500000" ></div><div class="field"><label for="dt">Date</label><input type="date" id="dt" value="" ></div></div><div class="field"><label for="pl">Place</label><input type="text" id="pl" value="Rohtak" ></div><div class="field" id="g1"><label id="l1" for="e1"></label><input id="e1"></div><div class="field" id="g2"><label id="l2" for="e2"></label><input id="e2"></div><button class="btn" id="pr" type="button"><i class="fa-solid fa-print"></i> Print</button><p class="note">Sample letters. Attach copies of ID or address proof if your bank asks, and always sign the printed letter.</p></section><section style="overflow-x:auto"><div class="paper doc" id="sheet"></div></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const dmy=v=>v?v.split('-').reverse().join('/'):'';
const readImg=(file,cb)=>{if(!file)return;const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);};
const T={
mob:{t:'Request to update mobile number',l:['New mobile number'],b:d=>'I request you to kindly update my mobile number in your bank records. My new mobile number is <b>'+d.e1+'</b>. Please also link it for SMS alerts and net banking.'},
addr:{t:'Request to update address',l:['New full address'],b:d=>'I request you to kindly change my address in your bank records. My new address is: <b>'+d.e1+'</b>. I am enclosing a copy of my address proof for your reference.'},
stmt:{t:'Request for account statement',l:['Period (for example 01/04/2025 to 31/03/2026)'],b:d=>'I request you to kindly issue a statement of my account for the period <b>'+d.e1+'</b>. Please provide it with your seal and signature.'},
card:{t:'Request to block debit card and issue a new card',l:['Last 4 digits of the card','Reason (lost, damaged, stolen)'],b:d=>'My debit card ending <b>'+d.e1+'</b> has been <b>'+d.e2+'</b>. I request you to block it immediately and issue a new debit card to me.'},
chq:{t:'Request for cheque book',l:['Number of leaves (for example 25)'],b:d=>'I request you to kindly issue a new cheque book of <b>'+d.e1+'</b> leaves for my account.'},
cls:{t:'Request to close account',l:['Reason for closing','Transfer balance to (account / pay order)'],b:d=>'I request you to kindly close my account for the reason: <b>'+d.e1+'</b>. Please transfer the remaining balance to <b>'+d.e2+'</b>. I am returning the unused cheque leaves and debit card.'}};
Object.keys(T).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=T[k].t;$('ty').appendChild(o);});$('dt').value=today();
function draw(){const k=$('ty').value,f=T[k];[1,2].forEach(i=>{$('g'+i).style.display=f.l[i-1]?'block':'none';$('l'+i).textContent=f.l[i-1]||'';});
 const d={e1:esc($('e1').value),e2:esc($('e2').value)};
 $('sheet').innerHTML='<p>Date: '+esc(dmy($('dt').value))+'<br>Place: '+esc($('pl').value)+'</p><p>To,<br>The Branch Manager<br><b>'+esc($('bank').value)+'</b><br>'+esc($('br').value)+'</p><p><b>Subject: '+f.t+'. Account No. '+esc($('ac').value)+'.</b></p><p>Respected Sir / Madam,</p><p>I, <b>'+esc($('nm').value)+'</b>, am an account holder in your branch with account number <b>'+esc($('ac').value)+'</b>. '+f.b(d)+'</p><p>Kindly do the needed at the earliest. I shall be thankful to you.</p><p>Yours faithfully,</p><br><p><b>'+esc($('nm').value)+'</b><br>Account No.: '+esc($('ac').value)+'<br>Mobile: '+esc($('mb').value)+'<br>Signature: ____________________</p>';}
document.querySelectorAll('.panel input,.panel select').forEach(e=>{e.oninput=draw;e.onchange=draw;});$('pr').onclick=()=>window.print();draw();</script></body></html>
