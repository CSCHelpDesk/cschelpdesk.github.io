<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold and silver rate | CSC Desk</title><meta name="description" content="Type the daily rate, print a rate board and work out the value of a weight.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.doc{width:210mm;min-height:150mm;padding:16mm;background:#fff;color:#111;text-align:center;font:14pt/1.6 "Segoe UI",Arial,sans-serif;max-width:100%}.doc h2{font-size:24pt;color:#0b6e4f}.doc table{width:100%;border-collapse:collapse;margin-top:14px;font-size:15pt}.doc th{background:#0b6e4f;color:#fff;padding:10px}.doc td{border-bottom:1px solid #ccc;padding:10px}.doc td+td,.doc th+th{text-align:right}.doc small{display:block;margin-top:14px;font-size:9pt;color:#555}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Utilities</div><h1>Gold and silver rate</h1><p>Type the daily rate, print a rate board and work out the value of a weight.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="sh">Shop name</label><input id="sh" type="text" value="Your Jewellers" placeholder=""></div><div class="field"><label for="dt">Rate date</label><input id="dt" type="date" value="" placeholder=""></div><div class="field"><label for="g24">Gold 24K rate per 10 gram (Rs.)</label><input id="g24" type="number" value="" placeholder="type today's rate"></div><div class="field"><label><input type="checkbox" id="au" checked style="width:auto"> Calculate gold 22K from 24K (x 0.916)</label></div><div class="field"><label for="g22">Gold 22K rate per 10 gram (Rs.)</label><input id="g22" type="number" value="" placeholder=""></div><div class="field"><label for="sv">Silver rate per kg (Rs.)</label><input id="sv" type="number" value="" placeholder="type today's rate"></div><h3 style="margin:14px 0 8px">Value calculator</h3><div class="field"><label for="mt">Metal</label><select id="mt"><option value="g24">Gold 24K</option><option value="g22">Gold 22K</option><option value="sv">Silver</option></select></div><div class="row2"><div class="field"><label for="wt">Weight (gram)</label><input id="wt" type="number" value="10" placeholder=""></div><div class="field"><label for="mk">Making charge (%)</label><input id="mk" type="number" value="0" placeholder=""></div></div><p class="result" id="cv" aria-live="polite"></p><button class="btn" id="pr"><i class="fa-solid fa-print"></i> Print rate board</button><p class="note" style="margin-top:8px">Rates are typed by you, not fetched live. Copy today's rate from your local bullion association or supplier. Saved on this computer.</p></section><section style="overflow-x:auto"><div class="paper doc" id="sheet"></div></section></div>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
const K=['sh','g24','g22','sv'];try{K.forEach(k=>{const v=localStorage.getItem('cscdesk_gs_'+k);if(v!==null)$(k).value=v;});}catch(e){}
$('dt').value=new Date().toISOString().slice(0,10);
const inr=n=>'Rs. '+Math.round(n).toLocaleString('en-IN');
const dmy=s=>{if(!s)return '';const p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0];};
function draw(){if($('au').checked){const g=+$('g24').value;$('g22').value=g?Math.round(g*0.916):'';$('g22').readOnly=true;}else $('g22').readOnly=false;
try{K.forEach(k=>localStorage.setItem('cscdesk_gs_'+k,$(k).value));}catch(e){}
const g24=+$('g24').value,g22=+$('g22').value,sv=+$('sv').value;
$('sheet').innerHTML='<h2>'+esc($('sh').value)+'</h2><p>Today\'s rate list | '+esc(dmy($('dt').value))+'</p><table><tr><th>Metal</th><th>Rate</th></tr><tr><td>Gold 24K (per 10 gram)</td><td>'+(g24?inr(g24):'-')+'</td></tr><tr><td>Gold 22K (per 10 gram)</td><td>'+(g22?inr(g22):'-')+'</td></tr><tr><td>Silver (per kg)</td><td>'+(sv?inr(sv):'-')+'</td></tr></table><small>Rates may change during the day. Making charges and GST extra.</small>';
const m=$('mt').value,w=+$('wt').value||0,mk=+$('mk').value||0;let base=0;if(m==='g24')base=g24/10*w;if(m==='g22')base=g22/10*w;if(m==='sv')base=sv/1000*w;
$('cv').textContent=base?('Metal '+inr(base)+'  |  Making '+inr(base*mk/100)+'  |  Total '+inr(base*(1+mk/100))+' (before GST)'):'Enter the rates to see the value.';}
document.querySelectorAll('.panel input,.panel select').forEach(e=>e.oninput=draw);$('mt').onchange=draw;$('pr').onclick=()=>window.print();draw();
</script></body></html>
