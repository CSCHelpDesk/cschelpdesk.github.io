<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image compressor | CSC Desk</title><meta name="description" content="Reduce a photo or scan to a target size in KB for portal uploads. Runs in your browser.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>Image compressor</h1><p>Reduce a photo or scan to a target size in KB for portal uploads. Runs in your browser.</p></div>
<div class="split"><section class="panel">
<div class="field"><label for="f">Choose image (JPG, PNG, WebP)</label><input type="file" id="f" accept="image/*"></div>
<div class="row2"><div class="field"><label for="kb">Target size (KB)</label><input type="number" id="kb" value="100" min="5"></div>
<div class="field"><label for="mw">Max width (px, 0 = keep)</label><input type="number" id="mw" value="0" min="0"></div></div>
<button class="btn" id="go">Compress</button>
<p class="note">Your picture is not uploaded anywhere. Output is always a JPG with a white background.</p></section>
<section class="panel"><p class="result" id="info" hidden></p><img id="pv" class="preview-img" alt="" style="margin:10px 0"><br>
<a class="btn" id="dl" hidden><i class="fa-solid fa-download"></i> Download</a></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);

let img=null,name='image';
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');const r=new FileReader();r.onload=ev=>{const i=new Image();i.onload=()=>{img=i;run();};i.src=ev.target.result;};r.readAsDataURL(f);};
const size=u=>u.length*0.75/1024;
function run(){ if(!img) return; const kb=parseFloat($('kb').value)||100, mw=parseInt($('mw').value)||0;
 let w=img.width,h=img.height; if(mw&&w>mw){h=Math.round(h*mw/w);w=mw;}
 const c=document.createElement('canvas'),x=c.getContext('2d');
 const paint=(cw,ch)=>{c.width=cw;c.height=ch;x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(img,0,0,cw,ch);};
 paint(w,h); let lo=0.05,hi=0.95,best=c.toDataURL('image/jpeg',lo);
 for(let i=0;i<8;i++){const q=(lo+hi)/2,u=c.toDataURL('image/jpeg',q); if(size(u)<=kb){best=u;lo=q;}else hi=q;}
 let s=1; while(size(best)>kb&&s>0.2){s-=0.1;paint(Math.round(w*s),Math.round(h*s));best=c.toDataURL('image/jpeg',0.5);}
 $('pv').src=best;$('info').hidden=false;$('info').textContent=c.width+' x '+c.height+' px | '+size(best).toFixed(1)+' KB'+(size(best)>kb?' (could not reach the target)':'');
 const a=$('dl');a.href=best;a.download=name+'-compressed.jpg';a.hidden=false;}
$('go').onclick=run;</script></body></html>
