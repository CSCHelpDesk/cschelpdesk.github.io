<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crop image | CSC Desk</title><meta name="description" content="Crop to standard photo and signature sizes for exam forms.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>Crop image</h1><p>Crop to standard photo and signature sizes for exam forms.</p></div>
<div class="split"><section class="panel"><div class="field"><label for="fl">Choose a photo</label><input type="file" id="fl" accept="image/*"></div><div class="field"><label for="ps">Size preset</label><select id="ps"><option value="350,450">Photo 3.5 x 4.5 cm (350 x 450 px)</option><option value="200,230">Photo 200 x 230 px</option><option value="140,60">Signature 140 x 60 px</option><option value="400,200">Signature 4 x 2 cm (400 x 200 px)</option><option value="300,300">Square 300 x 300 px</option><option value="600,600">Square 600 x 600 px</option><option value="0,0">Custom size</option></select></div><div class="row2"><div class="field"><label for="w">Width (px)</label><input id="w" type="number" value="350" placeholder=""></div><div class="field"><label for="h">Height (px)</label><input id="h" type="number" value="450" placeholder=""></div></div><div class="field"><label for="z">Zoom</label><input type="range" id="z" min="100" max="400" value="100"></div><div class="field"><label for="kb">Max file size in KB (optional)</label><input id="kb" type="number" value="" placeholder="e.g. 50"></div><button class="btn" id="go" disabled><i class="fa-solid fa-download"></i> Crop and download</button><p class="note" id="msg" style="margin-top:8px">Drag the picture to move it. Use the zoom slider to fit your face or signature inside the frame.</p></section><section class="panel" style="text-align:center"><canvas id="cv" style="border:2px dashed var(--brand);max-width:100%;touch-action:none;cursor:grab;background:#fff"></canvas></section></div>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
let img=null,S={x:0,y:0,s:1},W=350,H=450,cover=1,drag=null;const cv=$('cv'),cx=cv.getContext('2d');
function size(){W=Math.max(20,+$('w').value||350);H=Math.max(20,+$('h').value||450);cv.width=W;cv.height=H;const k=Math.min(1,380/Math.max(W,H))*(Math.max(W,H)<200?2:1);cv.style.width=Math.round(W*k)+'px';if(img){cover=Math.max(W/img.width,H/img.height);zoom(true);}else paint();}
function zoom(reset){const old=S.s;S.s=cover*(+$('z').value)/100;if(reset){S.x=(W-img.width*S.s)/2;S.y=(H-img.height*S.s)/2;}else{const cxp=(W/2-S.x)/old,cyp=(H/2-S.y)/old;S.x=W/2-cxp*S.s;S.y=H/2-cyp*S.s;}fit();paint();}
function fit(){S.x=Math.min(0,Math.max(W-img.width*S.s,S.x));S.y=Math.min(0,Math.max(H-img.height*S.s,S.y));}
function paint(){cx.fillStyle='#fff';cx.fillRect(0,0,W,H);if(img)cx.drawImage(img,S.x,S.y,img.width*S.s,img.height*S.s);else{cx.fillStyle='#999';cx.font='14px sans-serif';cx.textAlign='center';cx.fillText('Choose a photo',W/2,H/2);}}
$('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;$('z').value=100;$('go').disabled=false;size();};i.src=URL.createObjectURL(f);};
$('ps').onchange=()=>{const v=$('ps').value.split(',');if(v[0]!=='0'){$('w').value=v[0];$('h').value=v[1];}size();};
['w','h'].forEach(k=>$(k).oninput=()=>{$('ps').value='0,0';size();});$('z').oninput=()=>{if(img)zoom(false);};
cv.onpointerdown=e=>{if(!img)return;drag={x:e.clientX,y:e.clientY,ox:S.x,oy:S.y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';};
cv.onpointermove=e=>{if(!drag)return;const k=W/cv.getBoundingClientRect().width;S.x=drag.ox+(e.clientX-drag.x)*k;S.y=drag.oy+(e.clientY-drag.y)*k;fit();paint();};
cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab';};
cv.onwheel=e=>{if(!img)return;e.preventDefault();$('z').value=Math.min(400,Math.max(100,+$('z').value+(e.deltaY<0?8:-8)));zoom(false);};
$('go').onclick=()=>{if(!img)return;const max=(+$('kb').value||0)*1024;let q=.92;const run=()=>cv.toBlob(b=>{if(max&&b.size>max&&q>.12){q-=.06;run();return;}dl(b,'cropped.jpg');$('msg').textContent='Saved: '+W+' x '+H+' px, '+Math.round(b.size/1024)+' KB'+(max&&b.size>max?' (could not reach the size limit; try a smaller width/height)':'');},'image/jpeg',q);run();};
size();
</script></body></html>
