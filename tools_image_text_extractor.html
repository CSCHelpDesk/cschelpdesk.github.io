        /* Panels */
        .panel {
            background: #fff;
            padding: 25px;

            display: flex;
            flex-direction: column;
        }

        .panel h3 {

            color: #0b6e4f;

            margin-bottom: 15px;

        label {
            display: block;

        input[type="file"], select {
            width: 100%;

<style>
/* CSC Desk skin: portal chrome adapts to light/dark, tool cards stay paper-white */
@page{size:A4;margin:0}
@media print{body{min-height:0}.sheet-a4{padding:4mm!important;gap:2mm 3mm!important}}

<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

    <div class="container">
        <div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>Image Text Extractor (OCR)</h1><p>Extract editable text from scanned documents, certificates, and images instantly in your browser.</p></div>

        <div class="workspace">
            <!-- Left Panel: Upload & Preview -->
            <div class="panel">
                <h3>1. Upload Image</h3>
                <div class="input-group">
                    <label>Select Image (JPG / PNG)</label>
                    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
                </div>

                <div class="input-group">
                    <label>OCR Language</label>
                    <select id="ocrLang">
                        <option value="eng">English</option>
                        <option value="hin">Hindi</option>
                        <option value="eng+hin">English + Hindi</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Layout</label>
                    <select id="ocrPsm">
                        <option value="3">Auto (normal page)</option>
                        <option value="6">Single block of text</option>
                        <option value="4">Single column (forms, lists)</option>
                        <option value="7">Single line</option>
                        <option value="11">Scattered text (cards, stamps)</option>
                    </select>
                </div>
                <div class="input-group"><label><input type="checkbox" id="ocrEnh" checked style="width:auto"> Enhance image (enlarge, grey, more contrast) - recommended</label></div>
                <div class="input-group"><label><input type="checkbox" id="ocrBw" style="width:auto"> Black and white (for faded or shadowed scans)</label></div>
                <div class="input-group"><button type="button" class="btn-action" style="background:#555" onclick="rotateImg()"><i class="fa-solid fa-rotate-right"></i> Rotate 90&deg;</button></div>

                <div class="image-preview-box" id="previewContainer">
                    <span style="color: #888; font-size: 13px;"><i class="fa-regular fa-image" style="font-size: 24px; display:block; margin-bottom:5px;"></i> Image preview will appear here</span>
                </div>

                <button class="btn-action" id="extractBtn" onclick="extractText()" style="display: none;"><i class="fa-solid fa-wand-magic-sparkles"></i> Extract Text</button>
                <div id="statusMsg" class="status-text"></div>
            </div>

            <!-- Right Panel: Extracted Output -->
            <div class="panel">
                <h3>2. Extracted Text Output</h3>
                <div class="input-group" style="flex: 1;">
                    <label>Editable Result</label>
                    <textarea id="outputText" class="output-text" placeholder="Extracted text will appear here..."></textarea>
                </div>

                <div id="ocrInfo" class="status-text"></div>
                <button class="btn-action btn-success" onclick="copyText()"><i class="fa-solid fa-copy"></i> Copy to Clipboard</button>
                <button class="btn-action" style="margin-top:8px" onclick="saveTxt()"><i class="fa-solid fa-file-arrow-down"></i> Download as .txt</button>
            </div>
        </div>
    </div>

    </main>
<footer id="site-footer"></footer>
<script>
        let selectedFile = null, rot = 0;

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file; rot = 0;
            showPrev();
            document.getElementById('extractBtn').style.display = 'block';
            document.getElementById('outputText').value = '';
        }
        function showPrev() {
            document.getElementById('previewContainer').innerHTML = `<img src="${URL.createObjectURL(selectedFile)}" alt="Uploaded Image" style="transform:rotate(${rot}deg);max-width:100%">`;
        }
        function rotateImg() { if (!selectedFile) return; rot = (rot + 90) % 360; showPrev(); }

        function prepare(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const enh = document.getElementById('ocrEnh').checked, bw = document.getElementById('ocrBw').checked;
                    let s = 1;
                    if (enh) { const m = Math.max(img.width, img.height); s = m < 1800 ? 1800 / m : (m > 3500 ? 3500 / m : 1); }
                    const sw = Math.round(img.width * s), sh = Math.round(img.height * s), sideways = rot % 180 !== 0;
                    const c = document.createElement('canvas'); c.width = sideways ? sh : sw; c.height = sideways ? sw : sh;
                    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
                    x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -sw / 2, -sh / 2, sw, sh);
                    if (enh || bw) {
                        x.setTransform(1, 0, 0, 1, 0, 0);
                        const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
                        let lo = 255, hi = 0;
                        for (let i = 0; i < d.length; i += 4) { const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; d[i] = g; if (g < lo) lo = g; if (g > hi) hi = g; }
                        const span = Math.max(1, hi - lo);
                        for (let i = 0; i < d.length; i += 4) {
                            let g = (d[i] - lo) / span * 255;
                            if (bw) g = g > 140 ? 255 : 0;
                            d[i] = d[i + 1] = d[i + 2] = g;
                        }
                        x.putImageData(id, 0, 0);
                    }
                    resolve(c);
                };
                img.onerror = reject; img.src = URL.createObjectURL(file);
            });
        }

        async function extractText() {
            if (!selectedFile) {
                alert('Please upload an image first.');
                return;
            }
            const lang = document.getElementById('ocrLang').value;
            const statusMsg = document.getElementById('statusMsg');
            const outputText = document.getElementById('outputText');
            statusMsg.innerText = 'Preparing image...';
            outputText.value = ''; document.getElementById('ocrInfo').innerText = '';
            let worker;
            try {
                const canvas = await prepare(selectedFile);
                worker = Tesseract.createWorker({ logger: m => { if (m.status === 'recognizing text') statusMsg.innerText = 'Reading text... ' + Math.round(m.progress * 100) + '%'; else statusMsg.innerText = 'Loading ' + (m.status || '') + '...'; } });
                await worker.load(); await worker.loadLanguage(lang); await worker.initialize(lang);
                await worker.setParameters({ tessedit_pageseg_mode: document.getElementById('ocrPsm').value, preserve_interword_spaces: '1' });
                const ret = await worker.recognize(canvas);
                const clean = ret.data.text.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
                outputText.value = clean;
                const words = clean ? clean.split(/\s+/).length : 0;
                statusMsg.innerText = 'Text extraction completed.';
                const conf = Math.round(ret.data.confidence || 0);
                document.getElementById('ocrInfo').innerText = words + ' words. Confidence ' + conf + '%.' + (conf < 70 ? ' Low confidence: try Black and white, rotate, or a clearer photo, and check the text carefully.' : ' Please check names and numbers before using.');
            } catch (error) {
                console.error(error);
                statusMsg.innerText = 'Error during text extraction. Please try another image.';
            }
            if (worker) { try { await worker.terminate(); } catch (e) {} }
        }

        function saveTxt() {
            const v = document.getElementById('outputText').value;
            if (!v) return;
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([v], { type: 'text/plain;charset=utf-8' })); a.download = 'extracted-text.txt'; a.click();
        }

        function copyText() {
            const text = document.getElementById('outputText');
            text.select();
            text.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(text.value);
            alert('Extracted text copied to clipboard!');
        }
    </script>
<script src="assets/js/site.js"></script>
</body>
</html>
