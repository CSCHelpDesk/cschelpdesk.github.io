<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge PDF files | CSC Desk</title><meta name="description" content="Join several PDF files into one, in the order you choose. Text and quality stay as they are.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>.fl{list-style:none;margin:10px 0}.fl li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--surface)}.fl button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;padding:3px 9px;cursor:pointer;margin-left:3px}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>Merge PDF files</h1><p>Join several PDF files into one, in the order you choose. Text and quality stay as they are.</p></div>
<div class="panel" style="max-width:720px"><div class="field"><label for="f">Choose PDF files (you can pick several at once, and add more later)</label><input type="file" id="f" accept="application/pdf" multiple></div>
<ul class="fl" id="lst"></ul><p class="note">Use the arrows to set the order. Files with a password cannot be merged. Nothing is uploaded; it all happens in your browser.</p>
<button class="btn" id="go" type="button"><i class="fa-solid fa-object-group"></i> Merge and download</button> <p class="result" id="msg" hidden style="margin-top:10px"></p></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dl(bytes,name){const b=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
let files=[];const msg=t=>{$('msg').hidden=false;$('msg').textContent=t;};
$('f').onchange=async e=>{for(const f of e.target.files){try{const buf=await f.arrayBuffer(),d=await PDFLib.PDFDocument.load(buf);files.push({name:f.name,buf,pages:d.getPageCount()});}catch(err){msg('Could not read '+f.name+'. It may have a password or be damaged.');}}e.target.value='';list();};
function list(){$('lst').innerHTML=files.map((x,i)=>'<li><span>'+(i+1)+'. '+esc(x.name)+' <small>('+x.pages+' pages)</small></span><span><button data-u="'+i+'" aria-label="Move up">&uarr;</button><button data-d="'+i+'" aria-label="Move down">&darr;</button><button data-x="'+i+'" aria-label="Remove">&times;</button></span></li>').join('')||'<li class="note">No files added yet.</li>';}
$('lst').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.x!==undefined)files.splice(+d.x,1);else if(d.u!==undefined&&+d.u>0){const i=+d.u;[files[i-1],files[i]]=[files[i],files[i-1]];}else if(d.d!==undefined&&+d.d<files.length-1){const i=+d.d;[files[i+1],files[i]]=[files[i],files[i+1]];}list();};
$('go').onclick=async()=>{if(files.length<2){alert('Please add at least 2 PDF files.');return;}msg('Merging...');
 try{const out=await PDFLib.PDFDocument.create();for(const x of files){const d=await PDFLib.PDFDocument.load(x.buf),pg=await out.copyPages(d,d.getPageIndices());pg.forEach(p=>out.addPage(p));}
 const bytes=await out.save();dl(bytes,'merged.pdf');msg('Done. '+out.getPageCount()+' pages, '+(bytes.length/1024).toFixed(0)+' KB.');}catch(err){console.error(err);msg('Merge failed. Please check the files.');}};list();</script></body></html>
