<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notebook name sticker | CSC Desk</title><meta name="description" content="Print 10 name labels on one A4 sheet. One label for each subject.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}
.sheet{width:210mm;min-height:297mm;padding:12mm 10mm;display:grid;grid-template-columns:repeat(2,90mm);grid-auto-rows:50mm;gap:5mm 10mm;justify-content:center;align-content:start;--lc:#0b6e4f}
.lbl{border:1.5px dashed #888;border-radius:3mm;padding:2.5mm 4mm;display:flex;flex-direction:column;font-size:10pt;line-height:1.3;overflow:hidden}
.lbl .sc{text-align:center;font-size:8.5pt;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .sub{font-size:15pt;font-weight:800;text-align:center;color:var(--lc);border-bottom:2px solid var(--lc);line-height:1.25}
.lbl .row{display:flex;gap:3mm;align-items:center;justify-content:space-between;flex:1;padding-top:1.5mm;min-height:0}
.lbl .info{flex:1;min-width:0;overflow-wrap:anywhere}.lbl .info div{margin:.4mm 0}
.lbl .ph{flex:none;width:20mm;height:25mm;object-fit:cover;border:1px solid #888;display:block}
.lbl .phbox{flex:none;width:20mm;height:25mm;border:1px dashed #999;font-size:6.5pt;color:#888;text-align:center;display:flex;align-items:center;justify-content:center}
</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Utilities</div><h1>Notebook name sticker</h1><p>Print 10 name labels on one A4 sheet. One label for each subject.</p></div>
<div class="split"><section class="panel no-print">
<div class="field"><label for="nm">Student name</label><input id="nm" value="Student Name"></div>
<div class="row2"><div class="field"><label for="cl">Class / section</label><input id="cl" value="Class 5-A"></div><div class="field"><label for="ro">Roll no.</label><input id="ro" value="12"></div></div>
<div class="field"><label for="sc">School</label><input id="sc" value="School name"></div>
<div class="field"><label for="sb">Subjects (comma separated)</label><input id="sb" value="English, Hindi, Maths, Science, Social Science"></div>
<div class="field"><label for="co">Colour</label><select id="co"><option value="#0b6e4f">Green</option><option value="#1d4ed8">Blue</option><option value="#6d3fc0">Purple</option><option value="#c2255c">Rose</option><option value="#111827">Black</option></select></div>
<div class="field"><label><input type="checkbox" id="sp" checked> Show stamp-size photo (20 x 25 mm)</label></div>
<div class="field"><label for="pf">Student photo (optional)</label><input type="file" id="pf" accept="image/*"></div>
<p class="note">Without a photo, a dashed box is printed so you can paste a stamp photo.</p>
<button class="btn" id="pr"><i class="fa-solid fa-print"></i> Print stickers</button></section>
<section style="overflow-x:auto"><div class="paper sheet" id="sheet"></div></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
let photo='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const subs=$('sb').value.split(',').map(s=>s.trim()).filter(Boolean);const list=subs.length?subs:['Subject'];
 const pic=$('sp').checked?(photo?'<img class="ph" src="'+photo+'" alt="">':'<div class="phbox">Photo<br>20x25 mm</div>'):'';
 let h='';for(let i=0;i<10;i++){h+='<div class="lbl"><div class="sc">'+esc($('sc').value)+'</div><div class="sub">'+esc(list[i%list.length])+'</div><div class="row"><div class="info"><div>Name: <b>'+esc($('nm').value)+'</b></div><div>Class: <b>'+esc($('cl').value)+'</b></div><div>Roll no.: <b>'+esc($('ro').value)+'</b></div></div>'+pic+'</div></div>';}
 $('sheet').innerHTML=h;$('sheet').style.setProperty('--lc',$('co').value);}
$('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{photo=ev.target.result;draw();};r.readAsDataURL(f);};
['nm','cl','ro','sc','sb','co','sp'].forEach(k=>$(k).oninput=draw);$('sp').onchange=draw;$('pr').onclick=()=>window.print();draw();</script></body></html>
