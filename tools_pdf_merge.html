<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF merge | CSC Desk</title><meta name="description" content="Join several PDF files into one, in the order you want.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>@page{size:A4;margin:0}.it{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;background:var(--bg)}.it span{flex:1;overflow-wrap:anywhere}.it button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:4px 10px;cursor:pointer}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>PDF merge</h1><p>Join several PDF files into one, in the order you want.</p></div>
<section class="panel"><div class="field"><label for="fl">Choose PDF files (you can pick many)</label><input type="file" id="fl" accept="application/pdf" multiple></div><div id="ls"></div><button class="btn" id="go" disabled><i class="fa-solid fa-object-group"></i> Merge and download</button><p class="note" id="msg" style="margin-top:8px" aria-live="polite">Files are joined in the order shown. Use the arrows to change the order. Nothing is uploaded; it all happens on your computer.</p></section>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
let F=[];
function draw(){$('ls').innerHTML=F.map((f,i)=>'<div class="it"><b>'+(i+1)+'.</b><span>'+esc(f.name)+' <small>('+Math.round(f.size/1024)+' KB)</small></span><button data-u="'+i+'" title="Up">&uarr;</button><button data-w="'+i+'" title="Down">&darr;</button><button data-r="'+i+'" title="Remove">&times;</button></div>').join('');$('go').disabled=F.length<2;}
$('fl').onchange=e=>{F=F.concat([...e.target.files]);e.target.value='';draw();};
$('ls').onclick=e=>{const d=e.target.dataset,i=+(d.u??d.w??d.r);if(isNaN(i))return;if(d.u!==undefined&&i>0)[F[i-1],F[i]]=[F[i],F[i-1]];if(d.w!==undefined&&i<F.length-1)[F[i+1],F[i]]=[F[i],F[i+1]];if(d.r!==undefined)F.splice(i,1);draw();};
$('go').onclick=async()=>{$('go').disabled=true;$('msg').textContent='Merging... please wait';
try{const out=await PDFLib.PDFDocument.create();for(const f of F){const src=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{ignoreEncryption:true});const pg=await out.copyPages(src,src.getPageIndices());pg.forEach(p=>out.addPage(p));}
const b=new Blob([await out.save()],{type:'application/pdf'});dl(b,'merged.pdf');$('msg').textContent='Done. Merged PDF size: '+Math.round(b.size/1024)+' KB.';}
catch(e){$('msg').textContent='Could not merge. One of the PDFs may be password protected or damaged.';}$('go').disabled=F.length<2;};
</script></body></html>
