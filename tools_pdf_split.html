<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF split | CSC Desk</title><meta name="description" content="Pull pages out of a PDF, or save every page as its own file.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>@page{size:A4;margin:0}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / PDF & image</div><h1>PDF split</h1><p>Pull pages out of a PDF, or save every page as its own file.</p></div>
<section class="panel"><div class="field"><label for="fl">Choose a PDF</label><input type="file" id="fl" accept="application/pdf"></div><p id="info" class="note"></p><div class="field"><label for="md">What do you want?</label><select id="md"><option value="rng">Take selected pages into one new PDF</option><option value="each">Save every page as a separate PDF</option></select></div><div id="rw"><div class="field"><label for="rg">Pages to keep (example: 1-3, 5, 8-10)</label><input id="rg" type="text" value="" placeholder="1-3, 5"></div></div><button class="btn" id="go" disabled><i class="fa-solid fa-scissors"></i> Split and download</button><p class="note" id="msg" style="margin-top:8px" aria-live="polite"></p></section>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
let doc=null,buf=null,nm='file';
$('fl').onchange=async e=>{const f=e.target.files[0];if(!f)return;nm=f.name.replace(/\.pdf$/i,'');$('msg').textContent='Reading...';try{buf=await f.arrayBuffer();doc=await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true});$('info').textContent=f.name+' has '+doc.getPageCount()+' pages.';$('go').disabled=false;$('msg').textContent='';}catch(x){doc=null;$('go').disabled=true;$('msg').textContent='Could not read this PDF. It may be password protected or damaged.';}};
$('md').onchange=()=>$('rw').style.display=$('md').value==='rng'?'block':'none';
function parse(s,n){const out=[];s.split(',').forEach(p=>{p=p.trim();if(!p)return;const m=p.split('-').map(x=>parseInt(x));let a=m[0],b=m.length>1?m[1]:m[0];if(isNaN(a)||isNaN(b))return;if(a>b)[a,b]=[b,a];for(let i=a;i<=b;i++)if(i>=1&&i<=n&&!out.includes(i-1))out.push(i-1);});return out;}
async function take(idx){const o=await PDFLib.PDFDocument.create();const src=await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true});(await o.copyPages(src,idx)).forEach(p=>o.addPage(p));return new Blob([await o.save()],{type:'application/pdf'});}
$('go').onclick=async()=>{if(!doc)return;const n=doc.getPageCount();$('go').disabled=true;$('msg').textContent='Working...';
try{if($('md').value==='rng'){const idx=parse($('rg').value,n);if(!idx.length){$('msg').textContent='Please type valid page numbers, for example 1-3, 5.';$('go').disabled=false;return;}dl(await take(idx),nm+'-pages.pdf');$('msg').textContent='Done: '+idx.length+' page(s) saved.';}
else{for(let i=0;i<n;i++){dl(await take([i]),nm+'-page-'+(i+1)+'.pdf');await new Promise(r=>setTimeout(r,500));}$('msg').textContent='Done: '+n+' files saved. If your browser asked, allow multiple downloads.';}}
catch(e){$('msg').textContent='Something went wrong. Please try again.';}$('go').disabled=false;};
</script></body></html>
