<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator for Exams & Marks | CSC Desk</title>
<meta name="description" content="Calculate exam scores, percentages, and values instantly for students and CSC applications.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/portal.css">
<style>








        /* Calculator Sections */
        .calc-section {
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .calc-section h3 {
            font-size: 16px;
            color: #0b6e4f;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .input-row {
                flex-direction: column;
                gap: 10px;
            }
        }

        .input-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-calc {
            background-color: #0b6e4f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn-calc:hover {
            background-color: #07513a;
        }

        .result-display {
            margin-top: 15px;
            background: #e4f1ea;
            border: 1px solid #b9d8c9;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            color: #0b6e4f;
            font-size: 15px;
            display: none;
        }
    </style>
<style>
/* CSC Desk skin: portal chrome adapts to light/dark, tool cards stay paper-white */
@page{size:A4;margin:0}
@media print{body{min-height:0}.sheet-a4{padding:4mm!important;gap:2mm 3mm!important}}
</style>
<style id="pageStyle"></style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

    <div class="container">
        <div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Calculators</div><h1>Percentage Calculator</h1><p>Calculate exam scores, percentages, and values instantly for students and CSC applications.</p></div>

        <!-- Tool 1: Marks Percentage -->
        <div class="calc-section">
            <h3>1. Exam Marks Percentage Calculator</h3>
            <div class="input-row">
                <div class="input-group">
                    <label>Marks Obtained</label>
                    <input type="number" id="marksObtained" placeholder="e.g., 425">
                </div>
                <div class="input-group">
                    <label>Total Maximum Marks</label>
                    <input type="number" id="totalMarks" placeholder="e.g., 500">
                </div>
            </div>
            <button class="btn-calc" onclick="calculateMarksPercentage()">Calculate Percentage</button>
            <div id="marksResult" class="result-display"></div>
        </div>

        <!-- Tool 2: What is X% of Y -->
        <div class="calc-section">
            <h3>2. Find Percentage of a Value</h3>
            <div class="input-row">
                <div class="input-group">
                    <label>Percentage (%)</label>
                    <input type="number" id="percentageVal" placeholder="e.g., 18">
                </div>
                <div class="input-group">
                    <label>Total Value (Number)</label>
                    <input type="number" id="totalValue" placeholder="e.g., 2500">
                </div>
            </div>
            <button class="btn-calc" onclick="calculateValueOfPercentage()">Calculate Value</button>
            <div id="valueResult" class="result-display"></div>
        </div>

        <!-- Tool 3: Percentage Increase / Decrease -->
        <div class="calc-section">
            <h3>3. Percentage Increase / Decrease</h3>
            <div class="input-row">
                <div class="input-group">
                    <label>Initial Value</label>
                    <input type="number" id="initialVal" placeholder="e.g., 100">
                </div>
                <div class="input-group">
                    <label>Final Value</label>
                    <input type="number" id="finalVal" placeholder="e.g., 125">
                </div>
            </div>
            <button class="btn-calc" onclick="calculatePercentageChange()">Calculate Change</button>
            <div id="changeResult" class="result-display"></div>
        </div>
    </div>

    </main>
<footer id="site-footer"></footer>
<script>
        function calculateMarksPercentage() {
            const obtained = parseFloat(document.getElementById('marksObtained').value);
            const total = parseFloat(document.getElementById('totalMarks').value);
            const resBox = document.getElementById('marksResult');

            if (isNaN(obtained) || isNaN(total) || total <= 0) {
                alert('Please enter valid numbers for marks.');
                return;
            }

            const percentage = (obtained / total) * 100;
            resBox.innerHTML = `Percentage: ${percentage.toFixed(2)}%`;
            resBox.style.display = 'block';
        }

        function calculateValueOfPercentage() {
            const percent = parseFloat(document.getElementById('percentageVal').value);
            const total = parseFloat(document.getElementById('totalValue').value);
            const resBox = document.getElementById('valueResult');

            if (isNaN(percent) || isNaN(total)) {
                alert('Please enter valid numbers.');
                return;
            }

            const result = (percent / 100) * total;
            resBox.innerHTML = `${percent}% of ${total} is: ${result.toFixed(2)}`;
            resBox.style.display = 'block';
        }

        function calculatePercentageChange() {
            const initial = parseFloat(document.getElementById('initialVal').value);
            const final = parseFloat(document.getElementById('finalVal').value);
            const resBox = document.getElementById('changeResult');

            if (isNaN(initial) || isNaN(final) || initial === 0) {
                alert('Please enter valid non-zero values.');
                return;
            }

            const difference = final - initial;
            const percentageChange = (difference / initial) * 100;
            const type = percentageChange >= 0 ? 'Increase' : 'Decrease';

            resBox.innerHTML = `Percentage ${type}: ${Math.abs(percentageChange).toFixed(2)}%`;
            resBox.style.display = 'block';
        }
    </script>
<script src="assets/js/site.js"></script>
</body>
</html>
