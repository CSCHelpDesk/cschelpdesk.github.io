<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service rate list | CSC Desk</title><meta name="description" content="Make a printable rate board for your counter. One service per line.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.rl{width:210mm;min-height:297mm;padding:18mm 16mm;max-width:100%;overflow:auto;text-align:center}
.rl h2{font-size:26pt;color:#0b6e4f;font-weight:800}.rl p{color:#444}.rl h3{margin:14px 0 8px;font-size:15pt;border-top:3px solid #0b6e4f;border-bottom:3px solid #0b6e4f;padding:6px}
.rl table{width:100%;border-collapse:collapse;font-size:13pt;text-align:left}.rl th{background:#0b6e4f;color:#fff;padding:8px 10px}
.rl td{padding:8px 10px;border-bottom:1px solid #ccc}.rl td+td,.rl th+th{text-align:right;width:34%}.rl .foot{margin-top:14px;font-size:10pt}.rrow{display:grid;grid-template-columns:1fr 120px 36px;gap:6px;margin-bottom:6px}.rrow input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);min-width:0}.rrow .x{border:1px solid var(--line);background:var(--surface);color:#b3261e;border-radius:6px;font-size:18px;cursor:pointer}.rbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / CSC counter</div><h1>Service rate list</h1><p>Make a printable rate board for your counter. One service per line.</p></div>
<div class="split"><section class="panel no-print">
<div class="field"><label for="shop">Shop name</label><input id="shop" value="Your CSC Centre"></div>
<div class="field"><label for="sub">Line under the name (phone, address)</label><input id="sub" value="Call: 00000 00000"></div>
<h2>Edit rates</h2><p class="note">Change any service or rate in the boxes. The sheet updates at once and is saved on this computer.</p>
<div id="ed"></div>
<div class="rbar"><button class="btn" id="add" type="button"><i class="fa-solid fa-plus"></i> Add service</button><button class="btn alt" id="reset" type="button">Reset sample</button><button class="btn" id="pr" type="button"><i class="fa-solid fa-print"></i> Print</button></div></section>
<section style="overflow-x:auto"><div class="paper rl" id="sheet"></div></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const DEF=[["Black & white print (A4)","Rs. 2"],["Colour print (A4)","Rs. 10"],["Photocopy","Rs. 2"],["Scan and email","Rs. 10"],["Passport photo (8 pcs)","Rs. 50"],["Online form filling","As per form"],["Aadhaar update help","As per UIDAI fee"],["PAN application help","As per fee + service charge"]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=null; try{rows=JSON.parse(localStorage.getItem('cscdesk_rl2'));}catch(e){} if(!Array.isArray(rows)||!rows.length) rows=DEF.map(r=>r.slice());
try{['shop','sub'].forEach(k=>{const v=localStorage.getItem('cscdesk_rl_'+k); if(v!==null)$(k).value=v;});}catch(e){}
function save(){try{localStorage.setItem('cscdesk_rl2',JSON.stringify(rows));['shop','sub'].forEach(k=>localStorage.setItem('cscdesk_rl_'+k,$(k).value));}catch(e){}}
function sheet(){const b=rows.filter(r=>r[0].trim()).map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('');
 $('sheet').innerHTML='<h2>'+esc($('shop').value)+'</h2><p>'+esc($('sub').value)+'</p><h3>Service Rate List / सेवा दर सूची</h3><table><tr><th>Service</th><th>Rate</th></tr>'+b+'</table><p class="foot">Rates may change. Please ask at the counter.</p>';save();}
function editor(){$('ed').innerHTML=rows.map((r,i)=>'<div class="rrow"><input data-i="'+i+'" data-k="0" value="'+esc(r[0])+'" placeholder="Service"><input data-i="'+i+'" data-k="1" value="'+esc(r[1])+'" placeholder="Rate"><button type="button" class="x" data-del="'+i+'" aria-label="Delete row">&times;</button></div>').join('');}
$('ed').addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined){rows[+t.dataset.i][+t.dataset.k]=t.value;sheet();}});
$('ed').addEventListener('click',e=>{const d=e.target.closest('[data-del]');if(d){rows.splice(+d.dataset.del,1);editor();sheet();}});
$('add').onclick=()=>{rows.push(['','']);editor();sheet();const i=$('ed').querySelectorAll('input');if(i.length)i[i.length-2].focus();};
$('reset').onclick=()=>{if(confirm('Reset to the sample rates?')){rows=DEF.map(r=>r.slice());editor();sheet();}};
['shop','sub'].forEach(k=>$(k).oninput=sheet); $('pr').onclick=()=>window.print(); editor(); sheet();</script></body></html>
