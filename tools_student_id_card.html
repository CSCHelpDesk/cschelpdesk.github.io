<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student ID card | CSC Desk</title><meta name="description" content="School and college ID cards with photo, up to 8 per A4.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.sheet{width:210mm;min-height:297mm;padding:14mm 16mm;display:grid;grid-template-columns:repeat(2,85.6mm);grid-auto-rows:54mm;gap:5mm 6mm;justify-content:center;align-content:start;background:#fff;color:#111}
.ic{width:85.6mm;height:54mm;border:.3mm solid #999;border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;font-size:7.5pt;line-height:1.35;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ic .h{background:var(--c);color:#fff;text-align:center;padding:1.5mm 2mm;font-weight:800;font-size:8.5pt}.ic .h small{display:block;font-weight:400;font-size:6.5pt}
.ic .b{display:flex;gap:3mm;padding:2mm 3mm;flex:1}.ic .ph{width:21mm;height:26mm;border:.3mm solid #888;object-fit:cover;flex:none;background:#eee}
.ic .d b{color:var(--c)}.ic .f{display:flex;justify-content:space-between;padding:0 3mm 1.5mm;font-size:6.5pt}.ic .f span{border-top:.3mm solid #555;padding-top:.5mm}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Photo & ID print</div><h1>Student ID card</h1><p>School and college ID cards with photo, up to 8 per A4.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="sc">School / college name</label><input id="sc" type="text" value="Government Senior Secondary School" placeholder=""></div><div class="field"><label for="sa">School address</label><input id="sa" type="text" value="Rohtak, Haryana" placeholder=""></div><div class="row2"><div class="field"><label for="se">Session</label><input id="se" type="text" value="2026-27" placeholder=""></div><div class="field"><label for="cl">Class</label><input id="cl" type="text" value="8-A" placeholder=""></div></div><div class="field"><label for="nm">Student name</label><input id="nm" type="text" value="Rahul Sharma" placeholder=""></div><div class="row2"><div class="field"><label for="ro">Roll no.</label><input id="ro" type="text" value="12" placeholder=""></div><div class="field"><label for="db">Date of birth</label><input id="db" type="date" value="2013-05-14" placeholder=""></div></div><div class="field"><label for="fa">Father's name</label><input id="fa" type="text" value="Shri Mohan Sharma" placeholder=""></div><div class="row2"><div class="field"><label for="ph">Phone</label><input id="ph" type="text" value="98765 43210" placeholder=""></div><div class="field"><label for="bg">Blood group</label><select id="bg"><option value="">-</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option></select></div></div><div class="field"><label for="im">Student photo</label><input type="file" id="im" accept="image/*"></div><div class="field"><label for="co">Card colour</label><select id="co"><option value="#0b6e4f">Green</option><option value="#1d4ed8">Blue</option><option value="#6d3fc0">Purple</option><option value="#c2255c">Rose</option><option value="#d9480f">Orange</option></select></div><div class="field"><label for="n">Cards on sheet</label><select id="n"><option value="8">8 (full A4)</option><option value="6">6</option><option value="4">4</option><option value="2">2</option><option value="1">1</option></select></div><button class="btn" id="pr"><i class="fa-solid fa-print"></i> Print cards</button><p class="note" style="margin-top:8px">Card size 85.6 x 54 mm (standard PVC). Print on A4 at 100% scale.</p></section><section style="overflow-x:auto"><div class="paper sheet" id="sheet"></div></section></div>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
let PH='';$('im').onchange=e=>{const f=e.target.files[0];if(!f){PH='';draw();return;}const r=new FileReader();r.onload=x=>{PH=x.target.result;draw();};r.readAsDataURL(f);};
const dmy=s=>{if(!s)return '';const p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0];};
function draw(){const c=$('co').value,n=+$('n').value;
const one='<div class="ic" style="--c:'+c+'"><div class="h">'+esc($('sc').value)+'<small>'+esc($('sa').value)+' | Session '+esc($('se').value)+'</small></div><div class="b">'+(PH?'<img class="ph" src="'+PH+'" alt="">':'<div class="ph"></div>')+'<div class="d"><div><b>Name:</b> '+esc($('nm').value)+'</div><div><b>Class:</b> '+esc($('cl').value)+' &nbsp; <b>Roll:</b> '+esc($('ro').value)+'</div><div><b>Father:</b> '+esc($('fa').value)+'</div><div><b>DOB:</b> '+esc(dmy($('db').value))+($('bg').value?' &nbsp; <b>Blood:</b> '+esc($('bg').value):'')+'</div><div><b>Phone:</b> '+esc($('ph').value)+'</div></div></div><div class="f"><span>Student sign</span><span>Principal</span></div></div>';
$('sheet').innerHTML=Array(n).fill(one).join('');}
document.querySelectorAll('.panel input,.panel select').forEach(e=>{if(e.type!=='file')e.oninput=draw;});$('pr').onclick=()=>window.print();draw();
</script></body></html>
