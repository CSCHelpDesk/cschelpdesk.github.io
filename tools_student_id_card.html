<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student ID card maker | CSC Desk</title><meta name="description" content="Make school or college ID cards (85.6 x 54 mm) with photo and print up to 10 on one A4.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.fld textarea,.field textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%}.isheet{width:210mm;min-height:297mm;padding:8mm 0;display:grid;grid-template-columns:repeat(2,85.6mm);grid-auto-rows:54mm;gap:3mm 6mm;justify-content:center;align-content:start;--lc:#0b6e4f}
.idc{width:85.6mm;height:54mm;border:1px solid #999;border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;font-size:7.5pt;line-height:1.3;color:#111;background:#fff}
.idc .hd{background:var(--lc);color:#fff;display:flex;align-items:center;gap:2mm;padding:1.5mm 3mm;min-height:11mm}.idc .hd img{width:8mm;height:8mm;object-fit:contain;background:#fff;border-radius:50%}
.idc .sn{font-size:9.5pt;font-weight:800;line-height:1.15}.idc .tg{font-size:6pt;opacity:.9}.idc .bd{flex:1;display:flex;gap:3mm;padding:2mm 3mm;min-height:0}
.idc .pt{flex:none;width:20mm;height:25mm;object-fit:cover;border:1px solid #888}.idc .ph{display:flex;align-items:center;justify-content:center;color:#888;border-style:dashed}
.idc .nm{font-size:10pt;font-weight:800;color:var(--lc);margin-bottom:1mm}.idc .inf{min-width:0;overflow-wrap:anywhere}.idc .bd2{flex:1;padding:3mm;font-size:7.5pt}
.idc .ft{display:flex;justify-content:space-between;border-top:1.5px solid var(--lc);padding:1mm 3mm;font-size:6.5pt;font-weight:700}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / Photo & ID print</div><h1>Student ID card maker</h1><p>Make school or college ID cards (85.6 x 54 mm) with photo and print up to 10 on one A4.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="sn">School name</label><input type="text" id="sn" value="Your School Name" ></div><div class="field"><label for="tg">Line under school name</label><input type="text" id="tg" value="Affiliated / Address line" ></div><div class="field"><label for="se">Session</label><input type="text" id="se" value="2026-27" ></div><div class="row2"><div class="field"><label for="nm">Student name</label><input type="text" id="nm" value="Student Name" ></div><div class="field"><label for="cl">Class</label><input type="text" id="cl" value="5-A" ></div></div><div class="row2"><div class="field"><label for="ro">Roll no.</label><input type="text" id="ro" value="12" ></div><div class="field"><label for="db">Date of birth</label><input type="date" id="db" value="" ></div></div><div class="field"><label for="fh">Father's name</label><input type="text" id="fh" value="Father Name" ></div><div class="field"><label for="ph">Phone</label><input type="text" id="ph" value="98765 00000" ></div><div class="field"><label for="ad">Address</label><input type="text" id="ad" value="Village / Town, District" ></div><div class="row2"><div class="field"><label for="co">Colour</label><select id="co"><option value="#0b6e4f">Green</option><option value="#1d4ed8">Blue</option><option value="#6d3fc0">Purple</option><option value="#c2255c">Rose</option><option value="#b45309">Orange</option></select></div><div class="field"><label for="si">Side to print</label><select id="si"><option value="f">Front</option><option value="b">Back</option></select></div></div>
<div class="row2"><div class="field"><label for="cp">Cards on A4</label><select id="cp"><option>1</option><option>2</option><option>4</option><option>6</option><option selected>10</option></select></div><div class="field"><label for="pf">Student photo</label><input type="file" id="pf" accept="image/*"></div></div>
<div class="field"><label for="lf">School logo (optional)</label><input type="file" id="lf" accept="image/*"></div><button class="btn" id="pr" type="button"><i class="fa-solid fa-print"></i> Print</button><p class="note">Card size is 85.6 x 54 mm. Print the front, turn the paper over, then print the back on the same sheet if you want two sides.</p></section><section style="overflow-x:auto"><div class="paper isheet" id="sheet"></div></section></div></main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');};
const dmy=v=>v?v.split('-').reverse().join('/'):'';
const readImg=(file,cb)=>{if(!file)return;const r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(file);};
let ph='',lg='';
function card(){const g=x=>esc($(x).value);
 if($('si').value==='b')return '<div class="idc bk"><div class="hd"><div class="tx"><div class="sn">'+g('sn')+'</div></div></div><div class="bd2"><div><b>Address:</b> '+g('ad')+'</div><div><b>Phone:</b> '+g('ph')+'</div><div style="margin-top:2mm">If found, please return this card to the school.</div></div><div class="ft"><span>Session: '+g('se')+'</span><span>Principal</span></div></div>';
 return '<div class="idc"><div class="hd">'+(lg?'<img src="'+lg+'" alt="">':'')+'<div class="tx"><div class="sn">'+g('sn')+'</div><div class="tg">'+g('tg')+'</div></div></div><div class="bd">'+(ph?'<img class="pt" src="'+ph+'" alt="">':'<div class="pt ph">Photo</div>')+'<div class="inf"><div class="nm">'+g('nm')+'</div><div>Class: <b>'+g('cl')+'</b> &nbsp; Roll: <b>'+g('ro')+'</b></div><div>DOB: <b>'+esc(dmy($('db').value))+'</b></div><div>Father: <b>'+g('fh')+'</b></div><div>Phone: <b>'+g('ph')+'</b></div></div></div><div class="ft"><span>Session: '+g('se')+'</span><span>Principal</span></div></div>';}
function draw(){let h='';for(let i=0;i<(+$('cp').value||1);i++)h+=card();$('sheet').innerHTML=h;$('sheet').style.setProperty('--lc',$('co').value);}
$('pf').onchange=e=>readImg(e.target.files[0],u=>{ph=u;draw();});$('lf').onchange=e=>readImg(e.target.files[0],u=>{lg=u;draw();});
document.querySelectorAll('.panel input,.panel select').forEach(e=>{if(e.type!=='file'){e.oninput=draw;e.onchange=draw;}});$('pr').onclick=()=>window.print();draw();</script></body></html>
