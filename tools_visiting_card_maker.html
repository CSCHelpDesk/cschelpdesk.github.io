<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visiting card maker | CSC Desk</title><meta name="description" content="Make print-ready visiting cards, 10 per A4 sheet.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/portal.css">
<style>@page{size:A4;margin:0}.sheet{width:210mm;height:297mm;display:grid;grid-template-columns:repeat(2,90mm);grid-template-rows:repeat(5,50mm);justify-content:center;align-content:center;background:#fff;color:#111}
.vc{width:90mm;height:50mm;border:.25mm dashed #aaa;padding:5mm 6mm;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;font-size:8.5pt;line-height:1.3;position:relative;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vc .vn{font-size:15pt;font-weight:800;color:var(--c)}.vc .vd{font-size:9pt;color:#444}.vc .vs{font-weight:700;font-size:10pt}.vc .vl{font-size:7.5pt;color:#555}.vc .vf{font-size:8pt}
.vc.light{border-left:3mm solid var(--c)}.vc.dark{background:var(--c);color:#fff}.vc.dark .vn,.vc.dark .vd,.vc.dark .vl{color:#fff}
.vc.band{padding-top:12mm}.vc.band:before{content:"";position:absolute;left:0;top:0;right:0;height:7mm;background:var(--c)}
@media print{.sheet{box-shadow:none;margin:0}}</style></head><body>
<a class="skip-link" href="#main">Skip to content</a><header id="site-header"></header>
<main id="main"><div class="page-head no-print"><div class="crumbs"><a href="index.html">Home</a> / CSC counter</div><h1>Visiting card maker</h1><p>Make print-ready visiting cards, 10 per A4 sheet.</p></div>
<div class="split"><section class="panel no-print"><div class="field"><label for="nm">Name</label><input id="nm" type="text" value="Rakesh Kumar" placeholder=""></div><div class="field"><label for="ds">Designation / line under name</label><input id="ds" type="text" value="Proprietor" placeholder=""></div><div class="field"><label for="sh">Shop / business name</label><input id="sh" type="text" value="Kumar CSC Centre" placeholder=""></div><div class="field"><label for="ph">Phone</label><input id="ph" type="text" value="98765 43210" placeholder=""></div><div class="field"><label for="em">Email (optional)</label><input id="em" type="text" value="" placeholder=""></div><div class="field"><label for="ad">Address</label><textarea id="ad" rows="2">Main Market, Rohtak, Haryana</textarea></div><div class="field"><label for="sv">Services line (optional)</label><input id="sv" type="text" value="Aadhaar | PAN | Online Forms | Printing" placeholder=""></div><div class="field"><label for="sty">Card style</label><select id="sty"><option value="light">White card with colour bar</option><option value="dark">Dark colour card</option><option value="band">Colour top band</option></select></div><div class="field"><label for="co">Colour</label><select id="co"><option value="#0b6e4f">Green</option><option value="#1d4ed8">Blue</option><option value="#6d3fc0">Purple</option><option value="#c2255c">Rose</option><option value="#d9480f">Orange</option><option value="#111827">Black</option></select></div><button class="btn" id="pr"><i class="fa-solid fa-print"></i> Print 10 cards (A4)</button><p class="note" style="margin-top:8px">Print on A4 at 100% scale. Cut along the dashed lines. Card size 90 x 50 mm.</p></section><section style="overflow-x:auto"><div class="paper sheet" id="sheet"></div></section></div>
</main><footer id="site-footer"></footer>
<script src="assets/js/site.js"></script><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dl=(blob,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);};
function draw(){let h='';const c=$('co').value,s=$('sty').value;
const card='<div class="vc '+s+'" style="--c:'+c+'"><div><div class="vn">'+esc($('nm').value)+'</div><div class="vd">'+esc($('ds').value)+'</div></div><div><div class="vs">'+esc($('sh').value)+'</div>'+($('sv').value?'<div class="vl">'+esc($('sv').value)+'</div>':'')+'</div><div class="vf">'+($('ph').value?'Ph: '+esc($('ph').value):'')+($('em').value?' | '+esc($('em').value):'')+'<br>'+esc($('ad').value)+'</div></div>';
for(let i=0;i<10;i++)h+=card;$('sheet').innerHTML=h;}
document.querySelectorAll('.panel input,.panel select,.panel textarea').forEach(e=>e.oninput=draw);$('pr').onclick=()=>window.print();draw();
</script></body></html>
